<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon Calculator ⚡</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
        content="A futuristic neon calculator built with HTML, CSS and JavaScript featuring keyboard support, animations, and cyberpunk UI.">

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2721/2721297.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="theme theme-dark">

  <main class="calculator" aria-label="Neon Calculator">

    <!-- Top Bar -->
    <header class="top-bar">
      <span class="brand">NEON•CALC</span>
      <button type="button" id="themeToggle" aria-label="Toggle Theme">🌌</button>
    </header>

    <!-- Display -->
    <section class="display">
      <input
        id="display"
        type="text"
        readonly
        inputmode="none"
        aria-label="Calculator Display"
      >
    </section>

    <!-- Buttons -->
    <section class="buttons">
      <button type="button" class="op" data-key="AC">AC</button>
      <button type="button" class="op" data-key="DEL">DEL</button>
      <button type="button" class="op" data-key="%">%</button>
      <button type="button" class="op" data-key="/">÷</button>

      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" class="op" data-key="*">×</button>

      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" class="op" data-key="-">−</button>

      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" class="op" data-key="+">+</button>

      <button type="button" class="zero" data-key="0">0</button>
      <button type="button" data-key=".">.</button>
      <button type="button" class="equal" data-key="=">=</button>
    </section>

    <footer>© 2025 Soham Patil</footer>

  </main>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
